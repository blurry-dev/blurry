name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bumps version to provided value (e.g., 0.27.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump version and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          # Strip leading 'v' if supplied (e.g., v0.27.0 -> 0.27.0)
          RAW_VERSION="${{ inputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"

          poetry version "$CLEAN_VERSION"
          RESOLVED_VERSION=$(poetry version --short)

          echo "version=${RESOLVED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: prepare v${{ steps.bump.outputs.version }} release"
          title: "chore: prepare v${{ steps.bump.outputs.version }} release"
          body: |
            Automated pull request to bump version in `pyproject.toml` to `${{ steps.bump.outputs.version }}`.
          branch: "bump-version-v${{ steps.bump.outputs.version }}"
          base: main
          delete-branch: true
